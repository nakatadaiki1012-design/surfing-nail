<title>ネイルサーフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-screen 3D sea; left column = status + zoomed nail workbench; right = customer order; touch pads along the bottom. One sunny look, single theme. */
:root {
  --ink: #15304a;
  --paper: #fffaf4;
  --coral: #ff4f8b;
  --sun: #ffc93c;
  --lagoon: #10a5c2;
  --blush: #fde9e4;
  --line: rgba(21, 48, 74, .14);
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #8fd6f2; }
body {
  font-family: var(--body); color: var(--ink);
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

.card {
  background: var(--paper); border: 2px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
}
#hud {
  position: fixed; left: 0; right: 0;
  top: calc(8px + env(safe-area-inset-top, 0px));
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; align-items: flex-start; gap: 8px; pointer-events: none;
}
#status { width: 132px; padding: 8px 10px; display: grid; gap: 4px; font-size: 12px; box-sizing: border-box; }
#status .row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
#score { font-family: var(--display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
#time { font-family: var(--display); font-size: 16px; font-variant-numeric: tabular-nums; }
#time.low { color: var(--coral); }
.lbl { font-weight: 800; letter-spacing: .04em; opacity: .7; font-size: 10px; }
#brushRow { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 12px; }
#swatch {
  width: 12px; height: 16px; border-radius: 3px 3px 5px 5px; border: 2px solid var(--ink); flex: none;
  background: repeating-linear-gradient(45deg, #fff 0 3px, #dde 3px 6px); position: relative; margin-top: 6px;
}
#swatch::before { content: ""; position: absolute; left: 2px; right: 2px; top: -7px; height: 6px; background: var(--ink); border-radius: 2px; }
.bar { height: 7px; border-radius: 6px; background: #e7eef3; border: 1.5px solid var(--ink); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: #35c08a; }
#combo { font-weight: 800; color: var(--coral); font-size: 11px; min-height: 1em; }

#nailCard { padding: 5px 6px 6px; text-align: center; }
#nailHead { font-weight: 800; font-size: 11px; white-space: nowrap; }
#nailView { width: 80px; height: 100px; display: block; margin: 3px auto 0; border-radius: 8px; }

#order { width: 150px; padding: 6px 6px 8px; text-align: center; box-sizing: border-box; }
#order .ttl { font-family: var(--display); font-size: 12px; letter-spacing: .05em; }
#hand { width: 136px; height: 106px; display: block; margin: 0 auto; }
#want { font-size: 12px; font-weight: 800; }
#want b { padding: 1px 8px; border-radius: 999px; color: #fff; border: 1.5px solid var(--ink); }

#pop {
  position: fixed; left: 50%; top: 36%; transform: translate(-50%, -50%);
  font-family: var(--display); font-size: clamp(20px, 5.4vw, 38px); color: #fff;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--ink); pointer-events: none; white-space: nowrap;
  opacity: 0; transition: opacity .2s, transform .2s;
}
#pop.show { opacity: 1; transform: translate(-50%, -60%); }
#hint {
  position: fixed; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; font-weight: 800; font-size: 13px; padding: 6px 14px; border-radius: 999px;
  opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
}
#hint.show { opacity: .92; }
#big {
  position: fixed; left: 0; right: 0; top: calc(26% - 60px); text-align: center; pointer-events: none;
  font-family: var(--display); font-size: clamp(18px, 4.6vw, 32px); color: var(--sun);
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink);
}
#flash { position: fixed; inset: 0; background: #ff2a55; opacity: 0; pointer-events: none; transition: opacity .3s; }

/* touch controls */
#pad { display: none; }
body.touch #pad {
  display: flex; justify-content: space-between; align-items: flex-end;
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
#pad .grp { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
#pad button {
  font-family: var(--body); font-weight: 800; color: var(--ink);
  background: rgba(255, 250, 244, .9); border: 2px solid var(--ink); border-radius: 50%;
  box-shadow: 0 4px 0 var(--ink); width: 70px; height: 70px; font-size: 22px; touch-action: none;
}
#pad button.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); background: #fff; }
#bP { width: 88px !important; height: 88px !important; background: var(--coral) !important; color: #fff !important; font-size: 20px !important; }
#bJ { font-size: 13px !important; white-space: nowrap; }

/* overlays */
.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(16, 165, 194, .35), rgba(21, 48, 74, .55));
}
.panel { width: min(460px, 100%); padding: 20px 22px 18px; display: grid; gap: 12px; text-align: center; max-height: 100%; overflow: auto; box-sizing: border-box; }
.logo {
  font-family: var(--display); font-size: clamp(38px, 11vw, 58px); line-height: 1; color: var(--coral);
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink);
  letter-spacing: .02em; text-wrap: balance;
}
.lead { font-size: 15px; font-weight: 800; margin: 0; text-wrap: balance; }
.how { text-align: left; display: grid; gap: 7px; font-size: 13px; margin: 0; padding: 12px 14px; background: #eef8fb; border-radius: 10px; border: 1.5px solid var(--line); }
.how div { display: flex; gap: 10px; align-items: baseline; }
.how kbd {
  font-family: var(--body); font-weight: 800; font-size: 12px; min-width: 64px; text-align: center; flex: none;
  background: #fff; border: 1.5px solid var(--ink); border-radius: 6px; padding: 1px 6px; box-shadow: 0 2px 0 var(--ink);
}
.tips { text-align: left; font-size: 12.5px; margin: 0; padding: 10px 14px 10px 30px; background: var(--blush); border-radius: 10px; display: grid; gap: 4px; }
.btn {
  font-family: var(--display); font-size: 22px; color: #fff; background: var(--coral);
  border: 2px solid var(--ink); border-radius: 999px; padding: 12px 18px; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
#rank { font-family: var(--display); font-size: 72px; line-height: 1; color: var(--sun); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.res { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; text-align: left; font-size: 15px; font-weight: 800; padding: 12px 16px; background: #eef8fb; border-radius: 10px; }
.res span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) {
  #hud { gap: 5px; }
  #status { width: 112px; padding: 6px 8px; }
  #score { font-size: 18px; }
  #nailView { width: 68px; height: 85px; }
  #order { width: 128px; }
  #hand { width: 116px; height: 90px; }
}
@media (prefers-reduced-motion: reduce) { #pop, #flash { transition: none; } }
</style>

<div id="stage"></div>

<div id="hud" hidden>
  <div id="status" class="card">
    <div class="row"><span class="lbl">スコア</span><span id="score">0</span></div>
    <div class="row"><span class="lbl">のこり</span><span id="time">90.0</span></div>
    <div id="brushRow"><span id="swatch"></span><span id="brushName">なし</span></div>
    <div><div class="lbl">手の安定</div><div class="bar" id="wobBar"><i></i></div></div>
    <div id="combo"></div>
  </div>
  <div id="nailCard" class="card">
    <div id="nailHead"><span id="fingerName">親指</span></div>
    <canvas id="nailView"></canvas>
  </div>
  <div id="order" class="card">
    <div class="ttl">ご注文 No.<span id="orderNo">1</span></div>
    <canvas id="hand"></canvas>
    <div id="want">ほしい色 <b id="wantName">ピンク</b></div>
  </div>
</div>

<div id="big" hidden>ビッグウェーブ！ スコア2倍</div>
<div id="pop"></div>
<div id="hint"></div>
<div id="flash"></div>

<div id="pad">
  <div class="grp"><button id="bL" aria-label="左へ">◀</button><button id="bR" aria-label="右へ">▶</button></div>
  <div class="grp"><button id="bJ">ジャンプ</button><button id="bP">ぬる</button></div>
</div>

<div id="title" class="overlay">
  <div class="panel card">
    <div class="logo">ネイルサーフ</div>
    <p class="lead">波に乗りながら、お客さんのネイルを仕上げよう</p>
    <div class="how">
      <div><kbd>1</kbd><span>上の<b>ご注文と同じ色のボトル</b>をひろう</span></div>
      <div><kbd>2</kbd><span><b>ぬるボタンを長押し</b>でツメをぬる</span></div>
      <div><kbd>3</kbd><span>ぬっている間は<b>じっとする</b>ときれいに仕上がる</span></div>
    </div>
    <p class="lead" style="font-size:13px;font-weight:500">岩・ブイ・サメはよけるかジャンプ。ぶつかると3秒へります。<br>操作：← → 移動 ／ ↑ ジャンプ ／ スペース ぬる</p>
    <button class="btn" id="startBtn">スタート</button>
  </div>
</div>

<div id="over" class="overlay" hidden>
  <div class="panel card">
    <div class="lead">タイムアップ！</div>
    <div id="rank">A</div>
    <div class="res">
      <span>スコア</span><span id="rScore">0</span>
      <span>パーフェクト</span><span id="rPerfect">0</span>
      <span>仕上げたお客さん</span><span id="rOrders">0</span>
      <span>ベストスコア</span><span id="rBest">0</span>
    </div>
    <button class="btn" id="retryBtn">もう一回</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  const COLORS = [
    { name: 'ピンク', hex: '#ff5fa2' },
    { name: 'あか', hex: '#e8344a' },
    { name: 'みずいろ', hex: '#39c6f0' },
    { name: 'きいろ', hex: '#ffd23f' },
    { name: 'ミント', hex: '#3fe0a8' },
    { name: 'むらさき', hex: '#a46bff' },
  ];
  const RGB = COLORS.map(c => [1, 3, 5].map(i => parseInt(c.hex.slice(i, i + 2), 16)));
  const FINGER_NAMES = ['親指', '人さし指', '中指', 'くすり指', '小指'];
  const GAME_TIME = 90;
  const LANE = 7.5;

  if ('ontouchstart' in window || matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

  // =====================================================================
  // Nail workbench: a 160x200 pixel model of one fingernail.
  // Paint is real pixels, so coverage, streaks and spill are measured, not faked.
  // =====================================================================
  const NW = 160, NH = 200;
  function nailPath(c) {
    c.beginPath();
    c.moveTo(50, 140); c.lineTo(50, 70);
    c.arc(80, 70, 30, Math.PI, 0);
    c.lineTo(110, 140);
    c.quadraticCurveTo(80, 158, 50, 140);
    c.closePath();
  }
  const mask = new Uint8Array(NW * NH);
  let maskCount = 0;
  const BANDS = [[66, 94], [50, 72], [88, 110]]; // x ranges for center/left/right
  const bandCount = [0, 0, 0];
  (() => {
    const m = document.createElement('canvas'); m.width = NW; m.height = NH;
    const c = m.getContext('2d'); c.fillStyle = '#000'; nailPath(c); c.fill();
    const d = c.getImageData(0, 0, NW, NH).data;
    for (let i = 0; i < NW * NH; i++) if (d[i * 4 + 3] > 128) {
      mask[i] = 1; maskCount++;
      const x = i % NW; BANDS.forEach(([a, b], k) => { if (x >= a && x < b) bandCount[k]++; });
    }
  })();
  // stroke lanes: x, start y (cuticle), end y (tip)
  const LANES = [
    { x: 80, y0: 146, y1: 45, name: '真ん中' },
    { x: 65, y0: 141, y1: 60, name: '左' },
    { x: 95, y0: 141, y1: 60, name: '右' },
  ];
  const BRUSH_W = 28, BRUSH_H = 8;

  function evalNail(n) {
    const d = n.ctx.getImageData(0, 0, NW, NH).data;
    const [tr, tg, tb] = RGB[n.target];
    let good = 0, any = 0, spill = 0;
    const bandGood = [0, 0, 0];
    for (let i = 0; i < NW * NH; i++) {
      const a = d[i * 4 + 3];
      if (mask[i]) {
        if (a > 40) any++;
        if (a > 170) {
          const dr = d[i * 4] - tr, dg = d[i * 4 + 1] - tg, db = d[i * 4 + 2] - tb;
          if (dr * dr + dg * dg + db * db < 3600) {
            good++;
            const x = i % NW; BANDS.forEach(([lo, hi], k) => { if (x >= lo && x < hi) bandGood[k]++; });
          }
        }
      } else if (a > 60) spill++;
    }
    n.cov = good / maskCount;
    n.wrong = Math.max(0, any - good) / maskCount;
    n.spill = spill / maskCount;
    n.bandCov = bandGood.map((g, k) => g / bandCount[k]);
  }

  function makeNail(target) {
    const cv = document.createElement('canvas'); cv.width = NW; cv.height = NH;
    return { target, cv, ctx: cv.getContext('2d'), strokes: 0, sp: 0, lane: 0, cov: 0, spill: 0, wrong: 0, bandCov: [0, 0, 0],
      done: false, result: null, wet: 0, smudged: false, glitter: false, used: null, evalT: 0 };
  }

  function dab(n, x, y, w, ci, alpha) {
    const c = n.ctx;
    c.globalAlpha = alpha; c.fillStyle = COLORS[ci].hex;
    rr(c, x - w / 2, y - BRUSH_H / 2, w, BRUSH_H, BRUSH_H / 2); c.fill();
    c.globalAlpha = 1;
  }
  function smear(n, ci) {
    const c = n.ctx;
    c.save(); c.globalAlpha = 0.85; c.strokeStyle = COLORS[ci].hex; c.lineCap = 'round';
    c.lineWidth = rand(8, 13);
    const sx = rand(60, 100), sy = rand(70, 120), dir = Math.random() < 0.5 ? -1 : 1;
    c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(sx + dir * 25, sy + rand(-20, 20), sx + dir * rand(45, 60), sy + rand(10, 40)); c.stroke();
    c.restore();
  }

  // ---------- three.js scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  $('stage').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 500);

  const skyC = document.createElement('canvas'); skyC.width = 2; skyC.height = 256;
  const sg = skyC.getContext('2d');
  const grad = sg.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#2a86d6'); grad.addColorStop(0.55, '#8fd6f2'); grad.addColorStop(1, '#ffe2c4');
  sg.fillStyle = grad; sg.fillRect(0, 0, 2, 256);
  scene.background = new THREE.CanvasTexture(skyC);
  scene.fog = new THREE.Fog(0xbfe6f2, 55, 180);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x1d6f8f, 0.85));
  const sunLight = new THREE.DirectionalLight(0xfff1d6, 0.95);
  sunLight.position.set(-15, 40, 20); scene.add(sunLight);

  const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(14, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff1b0, fog: false }));
  sunDisc.position.set(70, 60, -380); scene.add(sunDisc);

  const islandMat = new THREE.MeshLambertMaterial({ color: 0x3f9a6b, flatShading: true });
  [[-60, -240, 18], [45, -260, 26], [95, -230, 14]].forEach(([x, z, s]) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), islandMat);
    m.scale.set(s * 1.6, s * 0.55, s); m.position.set(x, -1, z); scene.add(m);
  });

  // ocean
  const OW = 80, OL = 200, SX = 64, SZ = 128;
  const oceanGeo = new THREE.PlaneGeometry(OW, OL, SX, SZ);
  oceanGeo.rotateX(-Math.PI / 2);
  oceanGeo.translate(0, 0, -OL / 2 + 25);
  const opos = oceanGeo.attributes.position;
  const baseX = new Float32Array(opos.count), baseZ = new Float32Array(opos.count);
  for (let i = 0; i < opos.count; i++) { baseX[i] = opos.getX(i); baseZ[i] = opos.getZ(i); }
  const ocol = new Float32Array(opos.count * 3);
  oceanGeo.setAttribute('color', new THREE.BufferAttribute(ocol, 3));
  const ocean = new THREE.Mesh(oceanGeo, new THREE.MeshPhongMaterial({
    vertexColors: true, shininess: 60, specular: 0x4fa9c8, flatShading: true,
  }));
  scene.add(ocean);
  const DEEP = new THREE.Color('#0a78a3'), SHALLOW = new THREE.Color('#1fa9c6'), FOAM = new THREE.Color('#f4fcff');
  const tmpC = new THREE.Color();

  let T = 0, dist = 0, bigAmt = 0;
  function wall(x) { const d = -x - 9.5; return d > 0 ? Math.min(d * d * 0.085, 10) : 0; }
  function waveH(x, z) {
    const zz = z - dist;
    const amp = 1 + bigAmt * 0.9;
    return amp * (0.55 * Math.sin(zz * 0.22 + x * 0.12) + 0.3 * Math.sin(zz * 0.09 - x * 0.35 + T * 0.9))
      + 0.15 * Math.sin(x * 0.6 + zz * 0.5 + T * 1.7)
      + wall(x) * (1 + 0.12 * Math.sin(zz * 0.05 + T) + bigAmt * 0.35);
  }
  function updateOcean() {
    for (let i = 0; i < opos.count; i++) {
      const x = baseX[i], z = baseZ[i];
      const y = waveH(x, z);
      opos.setY(i, y);
      const w = wall(x);
      let foam = clamp((y - 0.75) / 1.1, 0, 1);
      if (w > 0) foam = clamp((w - 7.5) / 2.5, 0, 1) * 0.9 + foam * 0.3;
      tmpC.copy(DEEP).lerp(SHALLOW, clamp((y + 0.8) / 1.8, 0, 1)).lerp(FOAM, foam);
      ocol[i * 3] = tmpC.r; ocol[i * 3 + 1] = tmpC.g; ocol[i * 3 + 2] = tmpC.b;
    }
    opos.needsUpdate = true; oceanGeo.attributes.color.needsUpdate = true;
    oceanGeo.computeVertexNormals();
  }

  // ---------- surfer ----------
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, o));
  const SKIN = mat(0xf2c3a0), SUIT = mat(0x14b3c9), HAIR = mat(0x3a2418);
  const surfer = new THREE.Group(); scene.add(surfer);
  const board = new THREE.Group(); surfer.add(board);
  const deck = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.12, 32), mat(0xff5fa2, { roughness: 0.35 }));
  deck.scale.set(0.95, 1, 3.1); board.add(deck);
  const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.125, 24), mat(0xffffff));
  stripe.scale.set(0.16, 1, 2.9); board.add(stripe);
  const finM = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.35, 3), mat(0x15304a));
  finM.position.set(0, -0.2, 1.2); finM.rotation.x = Math.PI; board.add(finM);

  const rider = new THREE.Group(); board.add(rider);
  const limb = (r1, r2, len, m) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, len, 10), m);
  [-0.32, 0.32].forEach(z => {
    const leg = limb(0.09, 0.08, 0.85, SKIN); leg.position.set(0, 0.47, z * 0.8); leg.rotation.x = z * 0.45; rider.add(leg);
  });
  const hips = new THREE.Mesh(new THREE.SphereGeometry(0.21, 14, 10), SUIT); hips.position.y = 0.88; hips.scale.set(1, 0.7, 1.2); rider.add(hips);
  const torso = limb(0.2, 0.17, 0.55, SUIT); torso.position.y = 1.15; rider.add(torso);
  const neck = limb(0.06, 0.06, 0.12, SKIN); neck.position.y = 1.47; rider.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 14), SKIN); head.position.y = 1.66; rider.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.215, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), HAIR);
  hair.position.set(-0.02, 1.68, 0); hair.rotation.z = 0.35; rider.add(hair);

  // ---------- audio ----------

  function beep(f, dur, type = 'sine', vol = 0.12, slide = 1, delay = 0) {

    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }

    hit: () => beep(160, 0.35, 'sawtooth', 0.15, 0.4),

  // ---------- gameplay ----------

  }
  const brushWidth = () => BRUSH_W;

  function finishNail() {
    const n = nails[cur];
    evalNail(n);
    n.done = true; n.sp = 0;
    const { cov, spill } = n;
    let base, label, col;
    if (cov >= 0.86 && spill <= 0.03) { n.result = 'perfect'; base = 300; combo++; perfects++; label = 'パーフェクト！'; col = '#ffd23f'; sfx.perfect(); }
    else if (cov >= 0.75 && spill <= 0.08) { n.result = 'good'; base = 150; combo++; label = 'グッド'; col = '#ffffff'; sfx.good(); }
    else { n.result = 'messy'; base = 50; combo = 0; label = 'はみだし…'; col = '#ffd0dc'; sfx.bad(); }
    const pts = Math.round(base * (1 + Math.min(combo, 10) * 0.1) * (bigAmt > 0.5 ? 2 : 1));
    score += pts;
    pop(`${label} +${pts}`, col);
    cur++;
    if (cur >= 5) finishOrder();
  }

  function finishOrder() {
    ordersDone++;

    score += bonus; timeLeft += 5;
    pop(`お客さん完成！ +${bonus}  +5秒`, '#9ff3d0');
    setTimeout(sfx.order, 300);
    orderWait = 1.8;
  }

  function doPaint(dt) {
    const was = painting;
    painting = false;
    if (!keys.paint || orderWait > 0) { if (was) setBrushSound(false); return; }
    const n = nails[cur]; if (!n || n.done) return;
    if (jumpY > 0.05) { hint('空中ではぬれないよ'); setBrushSound(false); return; }
    if (brush !== n.target) { hint(`「${COLORS[n.target].name}」のボトルをひろってね`); setBrushSound(false); return; }
    painting = true;
    if (!was) setBrushSound(true);
    n.used = brush;
    const L = LANES[n.lane];
    const prevY = lerp(L.y0, L.y1, n.sp), prevX = L.x + drift;
    n.sp = Math.min(1, n.sp + dt * 1.45);
    by = lerp(L.y0, L.y1, n.sp);
    bx = L.x + drift;
    const steps = Math.max(1, Math.ceil(Math.abs(prevY - by) / 1.5));
    for (let k = 1; k <= steps; k++) {
      const t = k / steps;
      dab(n, lerp(prevX, bx, t), lerp(prevY, by, t), BRUSH_W, brush, 0.5);
    }
    if (n.sp >= 1) {
      n.strokes++; n.sp = 0; sfx.stroke();
      if (n.strokes >= 3) { finishNail(); setBrushSound(false); painting = false; return; }
      n.lane = n.strokes;
    }
  }

  function onHit() {
    invuln = 1.6; shake = 0.6; speed *= 0.6; combo = 0;
    timeLeft -= 3; sfx.hit(); flash();
    const n = nails[cur];
    let msg = 'ドボン！ -3秒';
    if (n && !n.done && (n.sp > 0 || n.strokes > 0) && n.used != null) { smear(n, n.used); n.sp = 0; msg = 'ぶつかって はみだした！ -3秒'; }
    pop(msg, '#ffd0dc');
    for (let i = 0; i < 40; i++) emit(px + rand(-1, 1), surfer.position.y + 0.3, rand(-1, 1), rand(-5, 5), rand(3, 8), rand(-3, 3));
  }

  function endGame() {
    state = 'over';
    setBrushSound(false);
    let best = 0;
    try { best = +localStorage.getItem('nailsurf-best3') || 0; if (score > best) { best = score; localStorage.setItem('nailsurf-best3', String(score)); } } catch (e) { best = Math.max(best, score); }
    const rank = score >= 9000 ? 'S' : score >= 6000 ? 'A' : score >= 3000 ? 'B' : 'C';
    $('rank').textContent = rank;
    $('rScore').textContent = score.toLocaleString();
    $('rPerfect').textContent = perfects;
    $('rOrders').textContent = ordersDone + ' 人';
    $('rBest').textContent = best.toLocaleString();
    $('over').hidden = false; $('big').hidden = true;
    keys.paint = keys.left = keys.right = false;
    document.querySelectorAll('#pad button').forEach(b => b.classList.remove('on'));
    setTimeout(() => $('retryBtn').focus(), 50);
  }

  function step(dt) {
    T += dt;
    const playing = state === 'play';

    let input = 0;
    if (playing) input = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    else if (state === 'title') input = clamp(Math.sin(T * 0.7) * 1.4 - px * 0.25, -1, 1);
    const accel = (painting ? 30 : 44);
    vx += input * accel * dt;
    vx *= Math.pow(0.04, dt);
    vx = clamp(vx, -11, 11);
    px += vx * dt;
    if (px < -LANE) { px = -LANE; vx = Math.max(0, vx); }
    if (px > LANE) { px = LANE; vx = Math.min(0, vx); }

    if (jumpY > 0 || vy > 0) {
      vy -= 22 * dt; jumpY += vy * dt;
      if (jumpY <= 0) { jumpY = 0; vy = 0; landJolt = 0.5; for (let i = 0; i < 10; i++) emit(px + rand(-0.6, 0.6), surfer.position.y, rand(-1, 1), rand(-2, 2), rand(1, 3), rand(0, 3)); }
    }
    landJolt = Math.max(0, landJolt - dt * 1.5);

    if (playing) {
      elapsed += dt; timeLeft -= dt;
      const target = lerp(18, 30, clamp(elapsed / 100, 0, 1));
      speed += (target - speed) * Math.min(1, dt * 0.8);
      if (bigLeft > 0) { bigLeft -= dt; if (bigLeft <= 0) { $('big').hidden = true; nextBig = elapsed + rand(18, 24); } }
      else if (elapsed >= nextBig && timeLeft > 8) { bigLeft = 7; $('big').hidden = false; beep(220, 0.6, 'sawtooth', 0.06, 2); }
    } else speed += (16 - speed) * Math.min(1, dt);
    bigAmt += ((bigLeft > 0 ? 1 : 0) - bigAmt) * Math.min(1, dt * 1.2);
    dist += speed * dt;

    // how shaky the painting hand is
    const waveShake = bigAmt * (0.28 + 0.22 * Math.sin(T * 7));
    const wTarget = clamp(Math.abs(vx) / 8 + Math.abs(input) * 0.12 + waveShake + landJolt + (invuln > 1 ? 0.6 : 0), 0, 1);
    wob += (wTarget - wob) * Math.min(1, dt * 8);
    // the brush drifts off its line with body motion and shake; a steady hand pulls it back
    const driftTarget = vx * 1.5 + (Math.sin(T * 7.3) + Math.sin(T * 12.7 + 1.3)) * wob * 7;
    drift += (driftTarget - drift) * Math.min(1, dt * 6);

    if (playing) {
      if (orderWait > 0) { orderWait -= dt; if (orderWait <= 0) newOrder(); }
      doPaint(dt);
      const diff = clamp(elapsed / GAME_TIME, 0, 1);
      obsTimer -= dt; botTimer -= dt;
      if (obsTimer <= 0) { spawnObstacles(diff); obsTimer = lerp(1.4, 0.75, diff) * rand(0.75, 1.25); }
      if (botTimer <= 0) { spawnBottles(); botTimer = rand(1.0, 1.6) * (bigAmt > 0.5 ? 0.7 : 1); }
      if (invuln > 0) invuln -= dt;
      if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    } else painting = false;

    const sy = waveH(px, 0);
    const dhx = (waveH(px + 0.5, 0) - waveH(px - 0.5, 0));
    const dhz = (waveH(px, -0.8) - waveH(px, 0.8)) / 1.6;
    surfer.position.set(px, sy + 0.08 + jumpY, 0);
    board.rotation.set(-Math.atan(dhz) * 0.8 + (jumpY > 0 ? -0.25 : 0), -vx * 0.05, Math.atan(dhx) * 0.9 - vx * 0.035);
    rider.rotation.y = Math.PI * 0.02;
    rider.rotation.z = -Math.abs(vx) * 0.01;
    rider.position.y = (jumpY > 0 ? -0.12 : 0) + Math.sin(T * 3) * 0.02 - (painting ? 0.08 : 0);
    surfer.visible = !(invuln > 0 && Math.floor(invuln * 12) % 2 === 0 && playing);

    armL.pivot.rotation.set(0, 0.55, -0.35);
    if (painting) {
      armR.pivot.rotation.set(0, -0.95 + Math.sin(T * 22) * 0.06 * (0.3 + wob), -0.25 + Math.sin(T * 11) * 0.05);
    } else {
      armR.pivot.rotation.set(0, 0.9 - vx * 0.03, 0.45 + Math.sin(T * 2) * 0.08);
    }

    if (jumpY === 0) {
      const n = 2 + Math.abs(vx) * 0.4;
      for (let i = 0; i < n; i++) emit(px + rand(-0.4, 0.4) - vx * 0.03, sy + 0.1, 1.4 + rand(0, 0.5), rand(-1.5, 1.5) - vx * 0.25, rand(1.5, 3.5), rand(2, 5));
    }

    for (const e of ents) {
      e.z += speed * dt;
      if (e.kind === 'fin') e.x = clamp(e.baseX + Math.sin(T * 1.6 + e.phase) * e.swing, -LANE, LANE);
      const y = waveH(e.x, e.z);
      e.mesh.position.set(e.x, y + e.yOff + (e.kind === 'bottle' ? Math.sin(T * 3 + e.phase) * 0.2 : 0), e.z);
      if (e.kind === 'bottle') e.mesh.rotation.y += dt * 2.4;
      if (e.kind === 'buoy') e.mesh.rotation.z = Math.sin(T * 2 + e.phase) * 0.2;
      if (e.kind === 'fin') e.mesh.rotation.y = Math.cos(T * 1.6 + e.phase) > 0 ? 0 : Math.PI;
      if (playing && !e.gone && Math.abs(e.z) < 1.3 && Math.abs(e.x - px) < e.r + 0.45) {
        if (e.kind === 'bottle') {
          if (jumpY < 2.2) {
            e.gone = true; score += 10;
            brush = e.color; sfx.pick();
            for (let i = 0; i < 16; i++) emit(e.x, y + 1, e.z, rand(-3, 3), rand(1, 5), rand(-3, 3));
          }
        } else if (invuln <= 0 && jumpY < 0.9) { e.gone = true; onHit(); }
      }
    }
    ents = ents.filter(e => {
      const keep = e.z < 14 && !(e.gone && e.kind === 'bottle');
      if (!keep) scene.remove(e.mesh);
      return keep;
    });

    for (let i = 0; i < PN; i++) {
      const p = parts[i];
      if (p.life > 0) {
        p.life -= dt; p.vy -= 12 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += (p.vz + speed * 0.15) * dt;
        if (p.life <= 0) p.y = -99;
      }
      pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;
    }
    pGeo.attributes.position.needsUpdate = true;

    updateOcean();

    shake = Math.max(0, shake - dt);
    const sh = shake * 0.5 + bigAmt * 0.06;
    camera.position.set(px * 0.55 + 1.2 + rand(-sh, sh), sy * 0.6 + 4.2 + jumpY * 0.4 + rand(-sh, sh), 7.8);
    camera.lookAt(px * 0.75, sy * 0.5 + 1.2, -9);

    if (popTimer > 0) { popTimer -= dt; if (popTimer <= 0) showNextPop(); }
    if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) $('hint').classList.remove('show'); }
    if (playing) updateHUD();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
    if ((k === 'ArrowUp' || k === 'w' || k === 'W') && !e.repeat) jump();
    if (k === ' ' || k === 'j' || k === 'J') keys.paint = true;
    if (k === 'Enter' && state !== 'play') start();
  });
  addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
    if (k === ' ' || k === 'j' || k === 'J') keys.paint = false;
  });
  addEventListener('blur', () => { keys.left = keys.right = keys.paint = false; });

  function bindHold(id, key, onDown) {
    const b = $(id);
    const down = e => { e.preventDefault(); if (key) keys[key] = true; b.classList.add('on'); if (onDown) onDown(); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
    const up = () => { if (key) keys[key] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', down);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, up));
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold('bL', 'left'); bindHold('bR', 'right'); bindHold('bP', 'paint'); bindHold('bJ', null, jump);

  function start() {
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
    resetGame();
    state = 'play';
    $('title').hidden = true; $('over').hidden = true;
    $('hud').hidden = false;
    fitCanvas(hand); fitCanvas(view); updateHUD();
    pop('お客さんが来たよ！', '#ffffff');
  }
  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    fitCanvas(hand); fitCanvas(view);
  });


  newOrder();
  requestAnimationFrame(loop);
})();
</script>
